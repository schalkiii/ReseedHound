# SeedHound 配置模板
# 复制此文件为 config.yaml 并填入实际值

global:
  concurrency: 20
  batch_size: 100
  api_timeout: 60
  download_timeout: 15
  download_interval: 5.0
  retry_count: 2
  retry_delay: 2.0
  mode: pieces_hash

db:
  path: data/cache.db

log:
  level: INFO
  file: logs/reseed.log

# === 定时运行配置（原生调度器）===
# enabled: true 时，即使执行默认 `reseed` 也会自动切换为定时循环运行
# interval_minutes: 每轮辅种之间的间隔（分钟）
# startup_delay: 启动后延迟多少秒再执行首轮（便于错峰，默认 0）
# run_on_start: 启动后是否立即执行首轮（false 则先等待一个完整间隔）
scheduler:
  enabled: false
  interval_minutes: 360
  startup_delay: 0
  run_on_start: true

# === 下载器配置 ===
# 单下载器模式（默认）：
downloader:
  type: qbittorrent
  host: 127.0.0.1
  port: 8080
  username: admin
  password: your_password_here
  torrent_dir: /path/to/BT_backup
  skip_hash_check: true
  auto_start: true
  tag: SeedHound

# 双下载器模式（跨下载器辅种）：
# downloader:
#   source:
#     type: qbittorrent
#     host: 192.168.1.100
#     port: 8080
#     username: admin
#     password: your_password_here
#     torrent_dir: /path/to/source/BT_backup
#   destination:
#     type: transmission
#     host: 127.0.0.1
#     port: 9091
#     username: admin
#     password: your_password_here
#     tag: SeedHound

notify:
  feishu:
    webhook_url: ""
    secret: ""

jackett:
  enabled: false
  url: "http://localhost:9117"
  api_key: ""
  concurrency: 5
  search_interval: 1.0
  timeout: 30

# === CookieCloud 配置（可选）===
# enable: true 时，调度器在每轮辅种开始前自动同步站点 Cookie
# 凭据只放本地 config.yaml，代码中不保留任何默认值
cookiecloud:
  enable: false
  url: "http://127.0.0.1:8082/cookie"
  uuid: "your-uuid"
  password: "your-password"

