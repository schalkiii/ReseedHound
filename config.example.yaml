# SeedHound 配置模板
# 复制此文件为 config.yaml 并填入实际值

global:
  concurrency: 20
  batch_size: 100
  api_timeout: 60
  download_timeout: 60
  download_interval: 5.0
  retry_count: 2
  retry_delay: 2.0
  mode: pieces_hash

db:
  path: data/cache.db

log:
  level: INFO
  file: logs/reseed.log

# === 下载器配置 ===
# 单下载器模式（默认）：
downloader:
  type: qbittorrent
  host: 127.0.0.1
  port: 8080
  username: admin
  password: your_password_here
  torrent_dir: /path/to/BT_backup
  skip_hash_check: true
  auto_start: true
  tag: SeedHound

# 双下载器模式（跨下载器辅种）：
# downloader:
#   source:
#     type: qbittorrent
#     host: 192.168.1.100
#     port: 8080
#     username: admin
#     password: your_password_here
#     torrent_dir: /path/to/source/BT_backup
#   destination:
#     type: transmission
#     host: 127.0.0.1
#     port: 9091
#     username: admin
#     password: your_password_here
#     tag: SeedHound

notify:
  feishu:
    webhook_url: ""
    secret: ""

jackett:
  enabled: false
  url: "http://localhost:9117"
  api_key: ""
  concurrency: 5
  search_interval: 1.0
  timeout: 30
